{% extends 'base-login.html' %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="vh-100 d-flex justify-content-center align-items-center">
        <form action="" method="POST">
            <div class="row">
                <div class="col-md-12">
                    <div class="d-flex justify-content-center mb-5">
                        <h1>Login no Chatão</h1>
                    </div>
                    <div class="col-12 mb-3">
                        <label for="username" class="form-label">Login</label>
                        <input type="text" class="form-control" name="username" aria-label="username" required>
                    </div>
                    <div class="col-12">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" name="password" aria-label="password" required>
                    </div>
                    <div class="d-flex justify-content-center mb-5">
                        <span>Não possui cadastro? <a href="cadastrar/">Cadastre-se</a></span>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary">Fazer login</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
